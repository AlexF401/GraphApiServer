services:
  graphapiserver:
    build: .
    image: graphapiserver:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /data/emails.db
      TOKEN_CACHE_PATH: /data/token_cache.json
    ports:
      - "8000:8000"
    volumes:
      - email-data:/data
    stop_grace_period: 15s

volumes:
  email-data:
